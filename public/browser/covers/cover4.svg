<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0709;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#4a121e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#990f26;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff007f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7f00ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#grad4)" />
  
  <!-- Perspective Grid lines -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.15">
    <!-- Horizontal lines -->
    <line x1="0" y1="220" x2="400" y2="220" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="270" x2="400" y2="270" />
    <line x1="0" y1="310" x2="400" y2="310" />
    <line x1="0" y1="360" x2="400" y2="360" />
    <!-- Vanishing point lines -->
    <line x1="200" y1="180" x2="-100" y2="400" />
    <line x1="200" y1="180" x2="0" y2="400" />
    <line x1="200" y1="180" x2="100" y2="400" />
    <line x1="200" y1="180" x2="200" y2="400" />
    <line x1="200" y1="180" x2="300" y2="400" />
    <line x1="200" y1="180" x2="400" y2="400" />
    <line x1="200" y1="180" x2="500" y2="400" />
  </g>
  
  <!-- Sun -->
  <circle cx="200" cy="180" r="65" fill="none" stroke="url(#neon-glow)" stroke-width="2.5" />
  <circle cx="200" cy="180" r="55" fill="#120c0e" opacity="0.8" />
  
  <!-- Waves / Soundwave bars -->
  <g transform="translate(110, 155)">
    <rect x="10" y="20" width="8" height="10" fill="url(#neon-glow)" rx="2" />
    <rect x="25" y="10" width="8" height="20" fill="url(#neon-glow)" rx="2" />
    <rect x="40" y="0" width="8" height="30" fill="url(#neon-glow)" rx="2" />
    <rect x="55" y="5" width="8" height="25" fill="url(#neon-glow)" rx="2" />
    <rect x="70" y="12" width="8" height="18" fill="url(#neon-glow)" rx="2" />
    <rect x="85" y="2" width="8" height="28" fill="url(#neon-glow)" rx="2" />
    <rect x="100" y="8" width="8" height="22" fill="url(#neon-glow)" rx="2" />
    <rect x="115" y="15" width="8" height="15" fill="url(#neon-glow)" rx="2" />
    <rect x="130" y="5" width="8" height="25" fill="url(#neon-glow)" rx="2" />
    <rect x="145" y="20" width="8" height="10" fill="url(#neon-glow)" rx="2" />
  </g>

  <!-- Text -->
  <text x="200" y="55" font-family="'Outfit', 'Inter', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">AGNI NATCHATHIRAM</text>
  <text x="200" y="375" font-family="'Outfit', 'Inter', sans-serif" font-size="13" font-weight="700" fill="#ff007f" text-anchor="middle" letter-spacing="2">SYNTHESIZER MAGIC</text>
</svg>
