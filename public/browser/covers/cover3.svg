<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#800020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1c0e12;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orange-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff7b00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffae00;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#grad3)" />
  
  <!-- Folk Mandala Design -->
  <g transform="translate(200, 205)" opacity="0.8">
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#orange-gold)" stroke-width="1" stroke-dasharray="4, 4" />
    <circle cx="0" cy="0" r="85" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />
    
    <!-- Rotated squares for geometric flower -->
    <rect x="-60" y="-60" width="120" height="120" fill="none" stroke="url(#orange-gold)" stroke-width="1.5" transform="rotate(0)" opacity="0.6" />
    <rect x="-60" y="-60" width="120" height="120" fill="none" stroke="url(#orange-gold)" stroke-width="1.5" transform="rotate(30)" opacity="0.6" />
    <rect x="-60" y="-60" width="120" height="120" fill="none" stroke="url(#orange-gold)" stroke-width="1.5" transform="rotate(60)" opacity="0.6" />
    
    <circle cx="0" cy="0" r="40" fill="#800020" stroke="url(#orange-gold)" stroke-width="2" />
    <circle cx="0" cy="0" r="15" fill="url(#orange-gold)" />
    
    <!-- Outer dots -->
    <circle cx="0" cy="-115" r="5" fill="#ffffff" />
    <circle cx="0" cy="115" r="5" fill="#ffffff" />
    <circle cx="-115" cy="0" r="5" fill="#ffffff" />
    <circle cx="115" cy="0" r="5" fill="#ffffff" />
    <circle cx="-81" cy="-81" r="4" fill="url(#orange-gold)" />
    <circle cx="81" cy="-81" r="4" fill="url(#orange-gold)" />
    <circle cx="-81" cy="81" r="4" fill="url(#orange-gold)" />
    <circle cx="81" cy="81" r="4" fill="url(#orange-gold)" />
  </g>

  <!-- Text -->
  <text x="200" y="60" font-family="'Outfit', 'Inter', sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">KARAGATTAKARAN</text>
  <text x="200" y="365" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="600" fill="url(#orange-gold)" text-anchor="middle" letter-spacing="2">RURAL FOLK HITS</text>
</svg>
