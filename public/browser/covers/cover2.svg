<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3d0c11;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f090b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="wine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#800020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58111A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f6d365;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fda085;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="400" fill="url(#grad2)" />
  
  <!-- Outer border -->
  <rect x="25" y="25" width="350" height="350" rx="10" fill="none" stroke="url(#wine)" stroke-width="2" opacity="0.5" />
  <rect x="35" y="35" width="330" height="330" rx="8" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.3" />

  <!-- Abstract Drama Silhouette / Mask lines -->
  <g transform="translate(200, 200)">
    <path d="M-60,-30 C-60,-80 60,-80 60,-30 C60,40 10,70 0,90 C-10,70 -60,40 -60,-30 Z" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.8" />
    <path d="M-40,-20 C-40,-50 40,-50 40,-20 C40,30 10,50 0,70 C-10,50 -40,30 -40,-20 Z" fill="url(#wine)" opacity="0.4" />
    <circle cx="-20" cy="-20" r="8" fill="url(#gold)" />
    <circle cx="20" cy="-20" r="8" fill="url(#gold)" />
    <path d="M-20,20 Q0,35 20,20" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Text -->
  <text x="200" y="75" font-family="'Outfit', 'Inter', sans-serif" font-size="28" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">NAYAKAN</text>
  <text x="200" y="345" font-family="'Outfit', 'Inter', sans-serif" font-size="14" font-weight="600" fill="url(#wine)" text-anchor="middle" letter-spacing="2">EPIC DRAMAS</text>
</svg>
